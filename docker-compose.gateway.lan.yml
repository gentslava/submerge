# Optional real LAN attachment. Only opt selected clients into this gateway.
# Use together with docker-compose.gateway.yml on a Linux Docker host.
services:
  submerge:
    environment:
      GATEWAY_LAN_ACCESS: lan
networks:
  gateway-lan:
    driver: macvlan
    internal: false
    driver_opts: !override
      parent: ${GATEWAY_LAN_PARENT:?Set the actual Linux LAN parent interface}
    ipam:
      config:
        - subnet: ${GATEWAY_LAN_SUBNET:?Set the actual LAN subnet}
          gateway: ${GATEWAY_LAN_ROUTER:?Set the LAN router}
