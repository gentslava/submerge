# Standalone opt-in stack, never an override of docker-compose.yml.
# Requires Compose >=2.36 for interface_name and gw_priority.
x-gateway-app: &gateway-app
  image: ${GATEWAY_SUBMERGE_IMAGE:-ghcr.io/gentslava/submerge:latest}
  build: .
  profiles: [gateway]
  environment: &gateway-env
    MIHOMO_API: http://127.0.0.1:9090
    MIHOMO_PROXY: http://127.0.0.1:7890
    MIHOMO_SECRET: ${GATEWAY_MIHOMO_SECRET:?}
    ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?}
    COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
    PROXY_ENDPOINT: 127.0.0.1:${GATEWAY_PROXY_PORT:-17890}
    GATEWAY_PROFILE_FILE: /gateway/profile.json
    GATEWAY_DEPLOYMENT: "true"
    GATEWAY_LAN_ACCESS: ${GATEWAY_LAN_ACCESS:-bridge}
    DOMAIN_VALIDATION_TOPOLOGY: compose
    DOMAIN_VALIDATION_PROXY_ENDPOINT: http://mihomo:7891
    DOMAIN_RULES_MODE: report
    HAPP_DECODER_URL: http://happ-decoder:8080
  volumes: &gateway-volumes
    - gateway-data:/app/data
    - gateway-mihomo:/mihomo
    - gateway-domain-rules:/domain-rules
    - type: bind
      source: ${GATEWAY_PROFILE_PATH:-./config/proxy.example.json}
      target: /gateway/profile.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GATEWAY_LISTS_DIR:?Set GATEWAY_LISTS_DIR to the published directory}
      target: /mihomo/private-lists
      read_only: true
      bind:
        create_host_path: false

services:
  # Docker can initialize the shared config volume from Mihomo's root-owned
  # image before the app image. Fix only our named-volume roots, never list files.
  gateway-volumes:
    image: ${GATEWAY_SUBMERGE_IMAGE:-ghcr.io/gentslava/submerge:latest}
    profiles: [gateway]
    user: "0:0"
    restart: "no"
    network_mode: none
    command:
      - sh
      - -ec
      - |
        chown 999:999 /app/data /mihomo /domain-rules
        chmod 0700 /app/data /mihomo /domain-rules
    volumes:
      - gateway-data:/app/data
      - gateway-mihomo:/mihomo
      - gateway-domain-rules:/domain-rules

  gateway-init:
    <<: *gateway-app
    command: [node, dist/gateway-cli.js, bootstrap]
    restart: "no"
    network_mode: none
    depends_on:
      gateway-volumes:
        condition: service_completed_successfully

  # Keep the namespace alive across an engine crash/restart. Joining Mihomo's
  # own namespace would strand the running app when Docker recreates that netns.
  gateway-network:
    image: ${GATEWAY_SUBMERGE_IMAGE:-ghcr.io/gentslava/submerge:latest}
    profiles: [gateway]
    command: [node, dist/gateway-network.js]
    user: "0:0"
    # Bootstrap installs the persistent forwarding guard, then drops uid and
    # capabilities to 999. Only the engine gets /dev/net/tun.
    cap_add: [NET_ADMIN]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const {readFileSync}=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const s=readFileSync('/proc/1/status','utf8');
          if(!/^Uid:\s+999\s/m.test(s)||!/^CapEff:\s+0+$/m.test(s))process.exit(1);
          execFileSync('nft',['list','table','inet','submerge_gateway'],{stdio:'ignore'});
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    sysctls:
      # Keep LAN forwarding disabled until the persistent guard is healthy.
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    dns: [1.1.1.1, 8.8.8.8]
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    # The authenticated engine API remains inside this stack; never publish :9090.
    ports:
      - "${GATEWAY_UI_BIND:-127.0.0.1}:${GATEWAY_UI_PORT:-13000}:3000"
      - "127.0.0.1:${GATEWAY_PROXY_PORT:-17890}:7890"
      - "${GATEWAY_DNS_BIND:-127.0.0.1}:${GATEWAY_DNS_PORT:-11053}:1053/udp"
      - "${GATEWAY_DNS_BIND:-127.0.0.1}:${GATEWAY_DNS_PORT:-11053}:1053/tcp"
    networks:
      egress:
        interface_name: eth0
        gw_priority: 1
        aliases: [mihomo]
      gateway-lan:
        interface_name: lan0
        ipv4_address: ${GATEWAY_LAN_IP:-172.30.220.2}

  mihomo:
    image: metacubex/mihomo:latest
    profiles: [gateway]
    command: [-d, /root/.config/mihomo, -ext-ctl, "0.0.0.0:9090"]
    restart: unless-stopped
    network_mode: service:gateway-network
    # Docker applies this to the shared namespace only after the healthy guard
    # dependency. No writable host sysctl mount or extra privilege is needed.
    sysctls:
      net.ipv4.ip_forward: "1"
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    depends_on:
      gateway-network:
        condition: service_healthy
        restart: true
    volumes:
      - gateway-mihomo:/root/.config/mihomo
      - gateway-domain-rules:/root/.config/mihomo/domain-rules:ro
      - type: bind
        source: ${GATEWAY_LISTS_DIR:?Set GATEWAY_LISTS_DIR}
        target: /root/.config/mihomo/private-lists
        read_only: true
        bind:
          create_host_path: false

  submerge:
    <<: *gateway-app
    network_mode: service:gateway-network
    restart: unless-stopped
    depends_on:
      gateway-network:
        condition: service_healthy
        restart: true
      mihomo:
        condition: service_started
        restart: true
      happ-decoder:
        condition: service_started
    healthcheck:
      test: [CMD, node, dist/gateway-cli.js, readiness]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  happ-decoder:
    image: ghcr.io/gentslava/submerge-happ-decoder:latest
    profiles: [gateway]
    restart: unless-stopped
    init: true
    volumes:
      - gateway-mihomo:/mihomo:ro
    networks: [egress]

networks:
  egress: {}
  gateway-lan:
    # Off-subnet client frames must reach Mihomo before routing; Docker's
    # internal bridge firewall would discard them. Clients use Mihomo as gateway.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${GATEWAY_LAN_SUBNET:-172.30.220.0/24}

volumes:
  gateway-data:
  gateway-mihomo:
  gateway-domain-rules:
